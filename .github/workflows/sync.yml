name: Sync Music I like to Apple Music

# Adds every song on the Spotify playlist to the Apple Music playlist.
# One way, additions only: nothing is ever removed from either side.
on:
  schedule:
    # Sundays at 15:00 UTC = 8 AM Denver while on standard time (MST).
    # GitHub cron runs in UTC, so this becomes 9 AM during daylight saving (MDT).
    # GitHub can also start scheduled runs a few minutes late.
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: show what would be added, change nothing"
        type: boolean
        default: false

permissions:
  contents: write   # commit data/playlist_sync.db back to the repo
  issues: write     # open or update the "Songs not found on Apple Music" issue

concurrency:
  group: playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - name: Install
        run: pip install -r requirements-sync.txt

      - name: Sync
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
          APPLE_MUSIC_PRIVATE_KEY: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
          # Optional repository variables; both playlists default to "Music I like".
          SPOTIFY_PLAYLIST_NAME: ${{ vars.SPOTIFY_PLAYLIST_NAME }}
          APPLE_PLAYLIST_NAME: ${{ vars.APPLE_PLAYLIST_NAME }}
          SPOTIFY_PLAYLIST_ID: ${{ vars.SPOTIFY_PLAYLIST_ID }}
          APPLE_PLAYLIST_ID: ${{ vars.APPLE_PLAYLIST_ID }}
          NOTIFY_MENTION: ${{ vars.NOTIFY_MENTION }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m playlist_sync run

      - name: Save the sync log
        # Runs even when the sync fails, so the failed run is logged too. Skipped for previews.
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [ ! -f data/playlist_sync.db ]; then
            echo "No database yet, nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playlist_sync.db
          if git diff --cached --quiet; then
            echo "Sync log unchanged."
            exit 0
          fi
          git commit -m "Update sync log (run ${{ github.run_number }})"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::Couldn't push the sync log."
          exit 1
