name: PlaylistSync
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  PlaylistSync:
    type: application
    platform: iOS
    sources:
      - path: PlaylistSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        DEVELOPMENT_TEAM: $(TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: PlaylistSync/Info.plist
      properties:
        CFBundleDisplayName: Playlist Sync
        UILaunchScreen: {}
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        NSAppleMusicUsageDescription: Used to read and update your Spotify Sync playlist.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: spotify-callback
            CFBundleURLSchemes: [playlistsync]
