name: Connect Spotify and Apple Music

# Opens a temporary sign-in page for your phone. It gives you the two user tokens
# (SPOTIFY_REFRESH_TOKEN and APPLE_MUSIC_USER_TOKEN) to add as repository secrets.
# The page link is in the run log and at the top of the run page. It stops after
# 20 minutes or when you tap "I'm done". Nothing is saved in the repo or the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - name: Install
        run: |
          pip install -r requirements-sync.txt
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"

      - name: Open the sign-in page
        env:
          CLOUDFLARED: ${{ runner.temp }}/cloudflared
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
          APPLE_MUSIC_PRIVATE_KEY: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
          SPOTIFY_PLAYLIST_NAME: ${{ vars.SPOTIFY_PLAYLIST_NAME }}
          APPLE_PLAYLIST_NAME: ${{ vars.APPLE_PLAYLIST_NAME }}
          SPOTIFY_PLAYLIST_ID: ${{ vars.SPOTIFY_PLAYLIST_ID }}
          APPLE_PLAYLIST_ID: ${{ vars.APPLE_PLAYLIST_ID }}
        run: python -m playlist_sync connect --minutes 20
