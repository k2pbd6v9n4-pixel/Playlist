name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["playlist_sync/**", "tests/**", "db/**", "requirements-sync.txt"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-sync.txt
      - run: python -m unittest discover -s tests -t . -v
